name: BRVS Chroma Remote Desktop - Windows Build

on:
  push:
    branches: [ brvs-chroma-corporate-dark-v1 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.8.3'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        shell: bash
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quickdesk-mcp/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('quickdesk-mcp/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build QuickDesk + Activate VS
        shell: cmd
        env:
          ENV_QUICKDESK_API_KEY: ${{ secrets.QUICKDESK_API_KEY }}
        run: |
          echo Activating Visual Studio Developer Command Prompt...
          set VSWHERE="%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          
          for /f "usebackq tokens=*" %%i in (`%VSWHERE% -latest -products * -property installationPath`) do (
            if exist "%%i\Common7\Tools\VsDevCmd.bat" (
              call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
              echo VS Dev Cmd activated from %%i
              goto :build
            )
          )
          
          echo WARNING: Could not find VsDevCmd.bat via vswhere, trying common paths...
          if exist "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" (
            call "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
            goto :build
          )
          if exist "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat" (
            call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
            goto :build
          )
          
          echo ERROR: Could not activate Visual Studio environment!
          exit /b 1
          
          :build
          echo Starting build...
          call scripts\build_qd_win.bat Release

      - name: Verify GUI executable exists
        shell: pwsh
        run: |
          Write-Host "=== Verifying GUI build ===" -ForegroundColor Cyan
          $possiblePaths = @(
            "output\QuickDesk\Release\QuickDesk.exe",
            "output\Release\QuickDesk.exe",
            "build-temp\Release\QuickDesk.exe"
          )
          $found = $false
          foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                  Write-Host "SUCCESS: Found QuickDesk.exe at $path" -ForegroundColor Green
                  Get-Item $path | Select-Object FullName, Length, LastWriteTime
                  $found = $true
                  break
              }
          }
          if (-not $found) {
              Write-Host "CRITICAL ERROR: QuickDesk.exe NOT FOUND!" -ForegroundColor Red
              Get-ChildItem -Path output, build-temp -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object FullName
              exit 1
          }

      - name: Build MCP Bridge
        shell: cmd
        run: call scripts\build_mcp_win.bat Release

      - name: Build Skill Host
        shell: cmd
        run: call scripts\build_skill_host_win.bat Release

      - name: Build WebClient
        shell: cmd
        run: call scripts\build_webclient_win.bat

      - name: Publish
        shell: cmd
        run: call scripts\publish_qd_win.bat Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer
        shell: cmd
        run: call scripts\package_qd_win.bat Release

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "ref-name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Upload BRVS Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: BRVS-Chroma-Remote-Desktop-win-x64-${{ steps.version.outputs.ref-name }}
          path: publish/QuickDesk-win-x64-setup.exe

      - name: Upload WebClient
        uses: actions/upload-artifact@v4
        with:
          name: BRVS-Chroma-Remote-Desktop-WebClient-${{ steps.version.outputs.ref-name }}
          path: WebClient/dist/
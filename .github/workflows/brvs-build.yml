name: BRVS Chroma Remote Desktop - Windows Build (Ninja)

on:
  push:
    branches: [ brvs-chroma-corporate-dark-v1 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.8.3'
  CMAKE_GENERATOR: Ninja

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        shell: bash
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quickdesk-mcp/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('quickdesk-mcp/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build QuickDesk
        shell: cmd
        env:
          ENV_QUICKDESK_API_KEY: ${{ secrets.QUICKDESK_API_KEY }}
          CMAKE_GENERATOR: Ninja
        run: call scripts\build_qd_win.bat Release

      - name: Verify GUI was built
        shell: pwsh
        run: |
          Write-Host "=== Checking for main GUI executable ==="
          $guiPath = "output\QuickDesk\Release\QuickDesk.exe"
          if (Test-Path $guiPath) {
              Write-Host "SUCCESS: QuickDesk.exe found at $guiPath" -ForegroundColor Green
              Get-Item $guiPath | Select-Object Name, Length, LastWriteTime
          } else {
              Write-Host "ERROR: QuickDesk.exe NOT FOUND! GUI build failed or was skipped." -ForegroundColor Red
              Get-ChildItem output -Recurse -Include *.exe | Select-Object FullName
              exit 1
          }

      - name: Build MCP Bridge
        shell: cmd
        run: call scripts\build_mcp_win.bat Release

      - name: Build Skill Host
        shell: cmd
        run: call scripts\build_skill_host_win.bat Release

      - name: Build WebClient
        shell: cmd
        run: call scripts\build_webclient_win.bat

      - name: Publish
        shell: cmd
        run: call scripts\publish_qd_win.bat Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer
        shell: cmd
        run: call scripts\package_qd_win.bat Release

      - name: Verify packaged installer contains GUI
        shell: pwsh
        run: |
          Write-Host "=== Verifying packaged installer contains GUI ==="
          # Extract installer temporarily and check for QuickDesk.exe
          $installer = Get-ChildItem publish -Filter "*.exe" | Select-Object -First 1
          if ($installer) {
              Write-Host "Installer found: $($installer.FullName)"
              # Simple check - if installer size is reasonable (> 50MB) it likely contains the GUI
              if ($installer.Length -gt 50MB) {
                  Write-Host "Installer size looks good: $([math]::Round($installer.Length / 1MB, 2)) MB" -ForegroundColor Green
              } else {
                  Write-Host "WARNING: Installer seems too small" -ForegroundColor Yellow
              }
          }

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "ref-name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Upload BRVS Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: BRVS-Chroma-Remote-Desktop-win-x64-${{ steps.version.outputs.ref-name }}
          path: publish/QuickDesk-win-x64-setup.exe

      - name: Upload WebClient
        uses: actions/upload-artifact@v4
        with:
          name: BRVS-Chroma-Remote-Desktop-WebClient-${{ steps.version.outputs.ref-name }}
          path: WebClient/dist/
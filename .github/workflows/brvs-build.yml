name: BRVS Chroma Remote Desktop - Windows Build

on:
  push:
    branches: [ brvs-chroma-corporate-dark-v1 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.8.3'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        shell: bash
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Detect VS environment
        shell: pwsh
        run: |
          $vs_install = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          echo "ENV_VS_INSTALL=$vs_install" >> $env:GITHUB_ENV

          $redist_root = Join-Path $vs_install "VC\Redist\MSVC"
          $latest = Get-ChildItem $redist_root -Directory |
            Where-Object { $_.Name -match '^\d+\.' } |
            Sort.Object Name -Descending |
            Select.Object -First 1
          echo "ENV_VCRUNTIME_VERSION=$($latest.Name)" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quickdesk-mcp/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('quickdesk-mcp/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build QuickDesk
        shell: cmd
        env:
          ENV_QUICKDESK_API_KEY: ${{ secrets.QUICKDESK_API_KEY }}
        run: call scripts\build_qd_win.bat Release

      - name: Build MCP Bridge
        shell: cmd
        run: call scripts\build_mcp_win.bat Release

      - name: Build Skill Host
        shell: cmd
        run: call scripts\build_skill_host_win.bat Release

      - name: Build WebClient
        shell: cmd
        run: call scripts\build_webclient_win.bat

      - name: Publish
        shell: cmd
        run: call scripts\publish_qd_win.bat Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer
        shell: cmd
        run: call scripts\package_qd_win.bat Release

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "ref-name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Upload BRVS Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: BRVS-Chroma-Remote-Desktop-win-x64-${{ steps.version.outputs.ref-name }}
          path: publish/QuickDesk-win-x64-setup.exe

      - name: Upload WebClient
        uses: actions/upload-artifact@v4
        with:
          name: BRVS-Chroma-Remote-Desktop-WebClient-${{ steps.version.outputs.ref-name }}
          path: WebClient/dist/